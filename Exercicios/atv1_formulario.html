<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Atividade 1</title>
</head>
<body>
<h1> Atividade</h1>
<form action="" method="post">
    <label> Nome :</label>
    <label>
        <input name="form_nome" type="text" placeholder="Ex : Marcos" required >
    </label>
    <br>
    <br>
    <label> Email :</label>
    <label>
    <input name="form_email" type="email" placeholder=" Ex : xxx@gmail.com" required>
    </label>
    <br>
    <br>
    <label> Assunto :</label>
    <label>
    <input name="form_assunto" type="text" required>
    </label>
    <br>
    <br>
    <label>
        Mensagem :
        <br>
    <textarea rows="10" cols="30" required></textarea>
    </label>
    <br>
    <br>
    <button type="submit">Enviar</button>
    <button type="reset">Redefinir</button>

</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Atividade 2</title>
</head>
<body>
<h1> Produto</h1>
<form action="" method="post">
    <label> Nome :</label>
    <label>
        <input name="form_nome" type="text" required>
    </label>
    <br>
    <br>
    <label>
        Descrição:
        <br>
        <textarea rows="10" cols="30" required></textarea>
    </label>
    <br>
    <br>
    <label> Categoria :</label>
    <label>
        <br>
    <input name="form_categoria" value="eletronicos" type="radio" >
        Eletrônicos
    </label>
    <label>
        <br>
    <input name="form_categoria" value="livros" type="radio">
        Livros
    </label>
    <label>
        <br>
    <input name="form_categoria" value="brinquedos" type="radio"required>
        Brinquedos
    </label>
    <label>
        <br>
    <input name="form_categoria" value="esportes" type="radio">
        Esportes
    </label>
    <label>
        <br>
    <input name="form_categoria" value="calcados" type="radio">
        Calçados
    </label>
    <br>
    <br>
    <label> País de fabricação :</label>
    <label>
        <br>
    <input name="form_fabricacao" value="brasil" type="radio" required>
        Brasil
    </label>
    <br>
    <label>
    <input name="form_fabricacao" value="china" type="radio">
        China
    </label>
    <br>
    <label>
    <input name="form_fabricacao" value="eua" type="radio">
        EUA
    </label>
    <br>
    <label>
    <input name="form_fabricacao" value="paraguai" type="radio" >
        Paraguai
    </label>
    <br>
    <label>
    <input name="form_fabricacao" value="japao" type="radio">
        Japão
    </label>
    <br>
    <br>
    <label> Preço :</label>
    <label>
        <input name="form_preco" type="number" required>
    </label>
    <br>
    <br>
    <label> Data de fabricação :</label>
    <label>
    <input name="form_fabricacao" type="date" required>
    </label>
    <br>
    <br>
    <button type="submit">Salvar</button>
    <button type="reset">Redefinir</button>
</form>

</body>
</html>

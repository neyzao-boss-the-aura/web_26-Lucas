<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
<h1> Exemplos de formulários </h1>
<!-- o "method" deve ser post-->
<form action="" method="get">
<!--    exemplo 1 de um label e input -->
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Ex: Lucas" required>
    </label>
    <br>
    <br>
    <label for="input2">  Sobrenome :</label>
<!-- O "name" deve começar com "form_"-->
    <input id="input2" name="form_sobrenome" type="text" placeholder="Ex: Silva" required>

<br>
    <br>

    <label> Idade :</label>
    <input name="form_idade" type="number" placeholder="Ex: 25" required>

    <br>
    <br>
    <label> Senha :</label>
    <input name="form_senha" type="password" required>
<br>
<br>
    <label> Qual o ano atual do seu EM :
        <br>
        <br>
    <input name="form_em" value="1"  type="radio">
    1 EM
    </label>
<br>
<br>
    <label>
    <input name="form_em" value="2"  type="radio">
    2 EM
    </label>
<br>
<br>
    <label>
    <input name="form_em" value="3"  type="radio">
    3 EM
    </label>
<br>
<br>
    <label> Qual sua carteira de motorista :</label>
    <br>
    <br>

    <label>
        Carro
    <input name="form_carro" type="checkbox">
       </label>
    <br>
    <br>
    <label>
        Moto
        <input name="form_moto" type="checkbox">
    </label>

<br>
<br>
    <label>
        Comentário:
        <br>
        <br>
        <textarea rows="10" cols="30"></textarea>
    </label>
    <br>
    <br>
    <label> Cidade :</label>
    <label>
        <select name="form_cidade">
            <option value="guararapes">Guararapes</option>
            <option value="aracatuba">Araçatuba</option>
            <option value="valparaiso">Valparaíso</option>
        </select>


    </label>
    <br>
    <br>
    <!-- Sempre vai ser "submit" para salvar as informações-->
    <button type="submit">Salvar</button>
    <button type="reset">Limpar</button>
</form>


</body>
</html>

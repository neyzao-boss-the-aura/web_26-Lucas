<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Atividade 3</title>
</head>
<body>
<h1> Pesquisa de satisfação do cliente</h1>
<form action="" method="post">
    <label> Nome :</label>
    <label>
        <input name="form_nome" type="text" required>
    </label>
    <br>
    <br>
    <label> Empresa :</label>
    <label>
        <input name="form_empresa" type="text" required>
    </label>
    <br>
    <br>
    <label> Idade :</label>
    <label>
        <input name="form_idade" value="10-20_anos"  type="radio">
        10-20 anos
    </label>
    <label>
        <input name="form_idade" value="20-30_anos" type="radio" required>
        20-30 anos
    </label>
    <label>
        <input name="form_idade" value="30-50_anos"  type="radio">
        30-50 anos
    </label
    ><label>
    <input name="form_idade" value="50-80_anos"  type="radio">
    50-80 anos
</label>
    <br>
    <br>
    <label> E-mail :</label>
    <label>
        <input name="form_email" type="email" required>
    </label>
    <br>
    <br>
    <label> Telefone comercial :</label>
    <label>
        <input name="form_telefone" required type="tel">
    </label>
    <label> Celular :</label>
    <label>
        <input name="form_celular" type="tel" required>
    </label>
    <br>
    <br>
    <br>
    <label> Como você avalia os nosso serviços atualmente ?</label>
    <br>
    <label>
        <input name="form_servico" value="regular" type="radio">
        Regular
    </label>
    <label>
        <input name="form_servico" value="bom" type="radio" required>
        Bom
    </label>
    <label>
        <input name="form_servico" value="excelente" type="radio">
        Excelente
    </label>
    <br>
    <br>
    <label> Como você avalia os serviços da área operacional ?</label>
    <br>
    <label>
        <input name="form_operacional" value="regular" type="radio">
        Regular
    </label>
    <label>
        <input name="form_operacional" value="bom" type="radio" required>
        Bom
    </label>
    <label>
        <input name="form_operacional" value="excelente" type="radio">
        Excelente
    </label>
    <br>
    <br>
    <label> Qual o nível de satisfação com o atendimento administrativo quando você precisa ?</label>
    <br>
    <label>
        <input name="form_atendimento" value="pouco_satisfatorio" type="radio">
        Pouco satisfatório
    </label>
    <label>
        <input name="form_atendimento" value="satisfatorio" type="radio" required>
        Satisfatório
    </label>
    <label>
        <input name="form_atendimento" value="muito_satisfatorio" type="radio">
        Muito satisfatório
    </label>
    <br>
    <br>
    <label> Os profissionais lhe atendem de forma satisfatória ?</label>
    <br>
    <label>
        <input name="form_profissionais_atdm" value="nao" type="radio">
        Não
    </label>
    <label>
        <input name="form_profissionais_atdm" value="sim" type="radio" required>
        Sim
    </label>
    <br>
    <br>
    <label> Você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos nossos serviços ?</label>
    <br>
    <label>
        <textarea rows="15" cols="40"></textarea>
    </label>
    <br>
    <br>
    <button type="submit">Enviar</button>
    <button type="reset">Redefinir</button>
</form>
</body>
